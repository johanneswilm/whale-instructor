[package]
name = "whale-instructor-desktop"
version = "0.1.0"
description = "Tauri v2 desktop shell for Whale Instructor"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-blec = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1.26.0"
tauri-plugin-dialog = "2.7.3"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
